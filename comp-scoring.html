<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Comp input</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E8E1;--surface:#F5F6F1;--ink:#1C2629;--muted:#5B6768;--line:#C8CDC3;
  --green:#12905A;--blue:#2A6AD0;--pink:#C2367F;--orange:#C9660F;--red:#B3261E;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Helvetica,Arial,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131A1C;--surface:#1C2628;--ink:#E7ECE5;--muted:#9AA6A4;--line:#2E3B3D;
  --green:#2FC983;--blue:#62A0F2;--pink:#EE64AE;--orange:#F29A45;--red:#F2766E;
}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:18px 16px 60px}
h1{font-family:var(--display);font-size:38px;margin:6px 0 2px;line-height:1}
h2{font-family:var(--display);font-size:28px;margin:28px 0 8px;line-height:1}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.go{background:var(--green);color:#fff;border-color:var(--green)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.form{display:grid;grid-template-columns:1fr 90px;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.form input{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;font-weight:600;width:100%}
.form .full{grid-column:1/-1}
.banner{border-left:4px solid var(--orange);background:var(--surface);padding:12px 14px;border-radius:0 10px 10px 0;margin:12px 0;font-size:15px}
.team{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.team.live{border-color:var(--green);border-width:2px}
.team b{font-size:17px}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1.5px solid;margin-left:6px;vertical-align:middle}
.tag.live{color:var(--green)}.tag.done{color:var(--blue)}.tag.wait{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.clock{font-family:var(--display);font-weight:700;font-size:clamp(72px,22vw,128px);line-height:.95;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0 6px}
.clock.low{color:var(--orange)}.clock.over{color:var(--red)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.tscore{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:12px 0 4px;text-align:center}
.tscore div{font-size:13px;color:var(--muted)}
.tscore b{display:block;font-family:var(--display);font-size:34px;color:var(--ink);line-height:1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.climber{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.climber h3{margin:0;font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.climber .sub{font-size:13px;color:var(--muted);margin:2px 0 8px}
.route{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:6px;min-height:46px;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-weight:600;font-size:17px;text-align:left}
.route small{font-size:12px;color:var(--muted);font-weight:500}
.route.on{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--bg))}
.route.top3{background:var(--green);border-color:var(--green);color:#fff}
.route.top3 small{color:#fff}
.route:disabled{cursor:default}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:6}
.toast.show{opacity:1}
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://mjogiumhumnmgkyblqgc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qb2dpdW1odW1ubWdreWJscWdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MjAzNTEsImV4cCI6MjEwNjE5NjM1MX0.vaBL3SqEK7kcqUcymNHex2DCsp-QFA0yaqdULvHp3m4';
const COMP_MS = 10*60*1000;
const KEY = 'comp:team:';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2000)}

/* ---- scoring (same rules as the Results tab) ---- */
const top3=a=>[...a].sort((x,y)=>y-x).slice(0,3);
const pts=a=>top3(a).reduce((s,l)=>s+l+1,0);
const handicap=t=>3*(t.v1+t.v2)-10;
const gross=t=>pts(t.s1)+pts(t.s2);
const net=t=>gross(t)-handicap(t);

let sb=null, teams=[], openId=null, editing=false, wake=null;

async function load(){
  const {data,error}=await sb.from('settings').select('key,value').like('key',KEY+'%');
  if(error){$('#app').innerHTML=`<div class="banner">Couldn't load: ${esc(error.message)}</div>`;return false}
  teams=data.map(r=>r.value).filter(v=>v&&!v.deleted).sort((a,b)=>a.order-b.order);
  return true;
}
async function save(t){
  const {error}=await sb.from('settings').upsert({key:KEY+t.id,value:t});
  if(error){console.error(error);toast('Couldn’t save. Check your connection.');return false}
  return true;
}
const get=id=>teams.find(t=>t.id===id);
const liveTeam=()=>teams.find(t=>t.status==='live');
const left=t=>t.startedAt+COMP_MS-Date.now();
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

/* ---- views ---- */
function renderList(){
  const live=liveTeam();
  let h=`<h1>Comp input</h1><p class="muted">Enter teams and score climbs.</p>`;
  if(live)h+=`<div class="banner" style="border-color:var(--green)"><b>${esc(live.n1)} &amp; ${esc(live.n2)}</b> is on the wall. <button class="btn go" data-open="${live.id}" style="margin-left:8px">Back to scoring</button></div>`;
  h+=`<h2>Teams</h2>`;
  if(!teams.length)h+=`<p class="muted">No teams yet. Add the first one below.</p>`;
  h+=teams.map(t=>{
    const tag=t.status==='live'?'<span class="tag live">Climbing</span>':t.status==='done'?'<span class="tag done">Done</span>':'<span class="tag wait">Waiting</span>';
    const score=t.status==='waiting'?'':` · score <b>${net(t)}</b> (${gross(t)} − ${handicap(t)})`;
    return `<div class="team ${t.status==='live'?'live':''}"><div><b>${esc(t.n1)} (V${t.v1}) &amp; ${esc(t.n2)} (V${t.v2})</b>${tag}<div class="muted">Handicap ${handicap(t)}${score}</div></div>
      <div class="acts">${t.status==='waiting'?`<button class="btn go" data-start="${t.id}" ${live?'disabled':''}>Start</button><button class="btn" data-edit="${t.id}">Edit</button><button class="btn danger" data-del="${t.id}">Delete</button>`
      :t.status==='live'?`<button class="btn go" data-open="${t.id}">Open</button>`
      :`<button class="btn" data-open="${t.id}">View</button><button class="btn danger" data-reset="${t.id}">Reset</button>`}</div></div>`}).join('');
  h+=`<h2>${S_editId?'Edit team':'Add a team'}</h2><div class="card"><div class="form">
    <label>Name 1<input id="n1" maxlength="40" autocomplete="off"></label><label>V-max 1<input id="v1" type="number" inputmode="numeric" min="0" max="11" step="1"></label>
    <label>Name 2<input id="n2" maxlength="40" autocomplete="off"></label><label>V-max 2<input id="v2" type="number" inputmode="numeric" min="0" max="11" step="1"></label>
    <div class="full acts" style="justify-content:flex-start"><button class="btn primary" id="saveTeam">${S_editId?'Save changes':'Add team'}</button>${S_editId?'<button class="btn" id="cancelEdit">Cancel</button>':''}</div></div>
    <p class="muted" id="formMsg" style="margin:10px 0 0"></p></div>`;
  $('#app').innerHTML=h;
  if(S_editId){const t=get(S_editId);$('#n1').value=t.n1;$('#v1').value=t.v1;$('#n2').value=t.n2;$('#v2').value=t.v2}
}
let S_editId=null;

function climberCol(t,k){
  const arr=t['s'+k],name=t['n'+k],v=t['v'+k];
  const counted=new Set(top3(arr));
  const canTap=t.status==='live'&&left(t)>0||editing;
  let rows='';
  for(let l=11;l>=0;l--){
    const on=arr.includes(l),c=on&&counted.has(l);
    rows+=`<button class="route ${on?'on':''} ${c?'top3':''}" data-toggle="${k}:${l}" aria-pressed="${on}" ${canTap?'':'disabled'}><span>${l}</span><small>${c?'counts · ':''}${l+1} pts</small></button>`;
  }
  return `<div class="climber"><h3>${esc(name)}</h3><div class="sub">V-max ${v} · ${pts(arr)} pts · ${arr.length} sent</div>${rows}</div>`;
}
function renderTeam(){
  const t=get(openId);if(!t){openId=null;renderList();return}
  const isLive=t.status==='live';
  let h=`<div class="top"><button class="btn" id="back">← Teams</button>`;
  if(isLive)h+=`<button class="btn danger" id="endNow">End early</button>`;
  else h+=`<button class="btn ${editing?'primary':''}" id="toggleEdit">${editing?'Done editing':'Fix scores'}</button>`;
  h+=`</div><h1 style="margin-top:14px">${esc(t.n1)} &amp; ${esc(t.n2)}</h1>`;
  if(isLive)h+=`<div class="clock" id="clock">10:00</div><div class="bar"><i id="barfill" style="width:100%"></i></div>`;
  else h+=`<p class="muted">${t.status==='done'?'Time is up. Scores are final unless you tap Fix scores.':'Not started.'}</p>`;
  h+=`<div class="tscore"><div><b>${gross(t)}</b>Climbing points</div><div><b>−${handicap(t)}</b>Handicap</div><div><b>${net(t)}</b>Team score</div></div>`;
  h+=`<div class="cols">${climberCol(t,1)}${climberCol(t,2)}</div>`;
  $('#app').innerHTML=h;
  tick();
}

/* ---- timer ---- */
async function finish(t){
  if(t.status!=='live')return;
  t.status='done';t.finishedAt=Math.min(Date.now(),t.startedAt+COMP_MS);
  releaseWake();
  beep(1560,.4);
  await save(t);
  if(openId===t.id)renderTeam();else if(!openId)renderList();
}
function tick(){
  const t=liveTeam();if(!t)return;
  const l=left(t);
  if(l<=0){finish(t);return}
  if(openId===t.id){
    const c=$('#clock');if(c){c.textContent=fmt(l);c.classList.toggle('low',l<=60000);}
    const b=$('#barfill');if(b)b.style.width=(l/COMP_MS*100)+'%';
    const sec=Math.ceil(l/1000);if(sec!==tick._s){if(sec<=3||sec===60)beep(sec===60?660:990,.1);tick._s=sec}
  }
}
setInterval(tick,250);
let actx=null;
function beep(f=880,dur=.12){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.3,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);o.start();o.stop(actx.currentTime+dur)}catch(e){}}
async function holdWake(){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&liveTeam())holdWake()});

/* ---- events ---- */
function readForm(){
  const n1=$('#n1').value.trim().replace(/\s+/g,' '),n2=$('#n2').value.trim().replace(/\s+/g,' ');
  const v1=Number($('#v1').value),v2=Number($('#v2').value);
  const ok=v=>Number.isInteger(v)&&v>=0&&v<=11;
  if(!n1||!n2)return {err:'Enter both names.'};
  if($('#v1').value===''||$('#v2').value===''||!ok(v1)||!ok(v2))return {err:'V-max must be a whole number from 0 to 11.'};
  return {n1,n2,v1,v2};
}
$('#app').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='saveTeam'){
    const f=readForm();if(f.err){$('#formMsg').textContent=f.err;return}
    b.disabled=true;
    let t;
    if(S_editId){t=get(S_editId);Object.assign(t,f)}
    else t={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),...f,status:'waiting',s1:[],s2:[],order:Date.now()};
    if(await save(t)){if(!S_editId)teams.push(t);S_editId=null;toast('Saved')}
    renderList();return}
  if(b.id==='cancelEdit'){S_editId=null;renderList();return}
  if(b.dataset.edit){S_editId=b.dataset.edit;renderList();window.scrollTo(0,document.body.scrollHeight);return}
  if(b.dataset.del){const t=get(b.dataset.del);if(!confirm(`Delete ${t.n1} & ${t.n2}?`))return;t.deleted=true;if(await save(t))teams=teams.filter(x=>x!==t);renderList();return}
  if(b.dataset.reset){const t=get(b.dataset.reset);if(!confirm(`Reset ${t.n1} & ${t.n2}? This clears their climbs and score.`))return;
    Object.assign(t,{status:'waiting',s1:[],s2:[],startedAt:null,finishedAt:null});await save(t);renderList();return}
  if(b.dataset.start){const t=get(b.dataset.start);
    if(!confirm(`Start the 10 minute timer for ${t.n1} & ${t.n2}?`))return;
    t.status='live';t.startedAt=Date.now();t.s1=[];t.s2=[];t.finishedAt=null;
    if(!await save(t)){t.status='waiting';return}
    openId=t.id;editing=false;holdWake();beep(1320,.35);renderTeam();return}
  if(b.dataset.open){openId=b.dataset.open;editing=false;if(get(openId).status==='live')holdWake();renderTeam();return}
  if(b.id==='back'){openId=null;editing=false;renderList();return}
  if(b.id==='toggleEdit'){editing=!editing;renderTeam();return}
  if(b.id==='endNow'){const t=get(openId);if(confirm('End this run now? Time has not run out.'))await finish(t);return}
  if(b.dataset.toggle){
    const t=get(openId);const [k,l]=b.dataset.toggle.split(':');const lv=Number(l);
    if(!(t.status==='live'&&left(t)>0||editing))return;
    const arr=t['s'+k],i=arr.indexOf(lv);
    if(i>=0)arr.splice(i,1);else arr.push(lv);
    renderTeam();
    if(!await save(t)){if(i>=0)arr.push(lv);else arr.splice(arr.indexOf(lv),1);renderTeam()}
  }
});

const PIN='2112';
function pinOk(){try{return sessionStorage.getItem('comp-pin')===PIN}catch(e){return false}}
function showPin(){
  $('#app').innerHTML=`<h1>Comp input</h1><p class="muted">Enter the PIN to continue.</p><div class="card" style="margin-top:14px"><div class="form"><label class="full">PIN<input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8"></label><div class="full"><button class="btn primary" id="pinGo">Unlock</button></div></div><p class="muted" id="pinMsg" style="margin:10px 0 0"></p></div>`;
  const go=()=>{if($('#pin').value===PIN){try{sessionStorage.setItem('comp-pin',PIN)}catch(e){}boot()}else{$('#pinMsg').textContent='Wrong PIN.';$('#pin').value=''}};
  $('#pinGo').onclick=go;$('#pin').onkeydown=e=>{if(e.key==='Enter')go()};$('#pin').focus();
}
async function boot(){
  if(!pinOk()){showPin();return}
  if(!window.supabase){$('#app').innerHTML='<div class="banner">Couldn\'t load the Supabase library. Check your connection and refresh.</div>';return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  if(!await load())return;
  const live=liveTeam();
  if(live&&left(live)>0){openId=live.id;holdWake();renderTeam()}else renderList();
  tick();
}
boot();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RNR Sends crew training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E8E1;--surface:#F5F6F1;--ink:#1C2629;--muted:#5B6768;--line:#C8CDC3;
  --green:#12905A;--blue:#2A6AD0;--pink:#C2367F;--orange:#C9660F;
  --timer-bg:#18282B;--timer-ink:#EEF2EC;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131A1C;--surface:#1C2628;--ink:#E7ECE5;--muted:#9AA6A4;--line:#2E3B3D;
  --green:#2FC983;--blue:#62A0F2;--pink:#EE64AE;--orange:#F29A45;--timer-bg:#0D1416;
}}
:root[data-theme="dark"]{
  --bg:#131A1C;--surface:#1C2628;--ink:#E7ECE5;--muted:#9AA6A4;--line:#2E3B3D;
  --green:#2FC983;--blue:#62A0F2;--pink:#EE64AE;--orange:#F29A45;--timer-bg:#0D1416;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100%;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:18px 16px 110px}
.brand{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:18px;letter-spacing:.02em;color:var(--muted)}
.brand b{color:var(--ink)}
.chip{font-family:var(--body);font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.chip.deload{border-color:var(--blue);color:var(--blue)}
.chip.test{border-color:var(--pink);color:var(--pink)}
.hero{margin:18px 0 6px}
.datenav{display:flex;align-items:center;gap:8px}
.datenav button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.day{font-family:var(--display);font-weight:700;font-size:clamp(52px,15vw,84px);line-height:.9;letter-spacing:-.01em;margin:10px 0 4px}
.focus{font-size:18px;font-weight:500;margin:0;color:var(--muted)}
.meter{margin:18px 0 8px;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.meter span{font-weight:600;font-size:15px;white-space:nowrap}
.banner{border-left:4px solid var(--blue);background:var(--surface);padding:12px 14px;border-radius:0 10px 10px 0;margin:12px 0;font-size:15px}
.banner.warn{border-color:var(--orange)}
.banner.pink{border-color:var(--pink)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.item{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.item.done{border-color:var(--green)}
.tick{flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.item.done .tick{border-color:var(--green);background:var(--green)}
.tick svg{width:18px;height:18px;opacity:0}
.item.done .tick svg{opacity:1}
.item h3{margin:3px 0 2px;font-size:17px;font-weight:600;line-height:1.25}
.rx{margin:0;color:var(--muted);font-size:15px}
.body{flex:1;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.load{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.load input{width:74px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:16px}
.go{border:0;border-radius:10px;padding:9px 14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:15px}
.sets{font-size:14px;color:var(--green);font-weight:600}
.rest-day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;font-size:17px;margin-top:14px}
h2{font-family:var(--display);font-size:30px;font-weight:700;margin:30px 0 8px;line-height:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--muted);font-size:14px}
.pain label{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}
.pain input[type=range]{width:100%;accent-color:var(--orange)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--orange);margin-top:2px;flex:none}
.people{display:flex;flex-direction:column;gap:14px}
.person{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center}
.person .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--display);font-size:20px}
.person .name{font-weight:600}
.dots{display:flex;gap:5px;margin-top:5px}
.dots i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.dots i.part{background:var(--blue)}
.dots i.full{background:var(--green)}
.dots i.rest{background:transparent;border:1px dashed var(--line)}
.score{font-family:var(--display);font-size:30px;font-weight:700;text-align:right;line-height:1}
.score small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
.feed{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.feed li{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.feed li:last-child{border-bottom:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.form input{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;font-weight:600;width:100%}
.form .full{grid-column:1/-1}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;max-width:140px;border:0;background:none;padding:12px 0 14px;font-weight:600;font-size:15px;color:var(--muted);border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--green)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:6}
.toast.show{opacity:1}
.how{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.how summary{cursor:pointer;font-weight:600;font-size:15px;color:var(--blue);padding:4px 0;list-style-position:inside}
.how .why{margin:8px 0 4px;font-size:15px;font-style:italic;color:var(--muted)}
.how ol,.guide ol{margin:8px 0 0;padding-left:22px;font-size:15px}
.how li,.guide li{margin:6px 0}
.guide dl{margin:0}
.guide dt{font-weight:600;font-size:16px;margin-top:14px}
.guide dt:first-child{margin-top:0}
.guide dd{margin:3px 0 0;color:var(--muted);font-size:15px}
.guide p{margin:0 0 10px;font-size:15px}
.guide p:last-child{margin-bottom:0}
.week td:first-child{font-weight:600;white-space:nowrap;padding-right:12px}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.rank.me{border-color:var(--ink)}
.rank .pos{font-family:var(--display);font-size:28px;font-weight:700;color:var(--muted);text-align:center}
.rank .name{font-weight:600;font-size:17px}
.tag{display:inline-block;margin-top:4px;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;border:1.5px solid}
.tag.ok{color:var(--green)}.tag.part{color:var(--blue)}.tag.no{color:var(--orange)}.tag.rest{color:var(--muted)}
.wts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:14px;color:var(--muted)}
.wts b{color:var(--ink)}
.who{display:grid;gap:10px}
.who button{padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:19px;font-weight:600;text-align:left}
.brand button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.scale{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px}
.load select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:15px;max-width:100%}
.load.lvl{flex-wrap:wrap}
.hint{margin:6px 0 0;font-size:14px;color:var(--blue);font-weight:500}
.self{margin:8px 0 0;font-size:14px;color:var(--muted);font-style:italic}
/* timer */
#timer{position:fixed;inset:0;background:var(--timer-bg);color:var(--timer-ink);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(26px + env(safe-area-inset-bottom,0px))}
#timer.open{display:flex}
.t-top{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.t-top h3{margin:0;font-size:18px;font-weight:600}
.t-top p{margin:2px 0 0;font-size:14px;opacity:.7}
.t-close{border:1px solid rgba(255,255,255,.25);background:none;color:inherit;border-radius:10px;padding:8px 12px;font-weight:600}
.ring{position:relative;width:min(78vw,380px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14}
.ring .trackc{stroke:rgba(255,255,255,.1)}
.ring .prog{stroke:var(--c,#2FC983);stroke-linecap:round;transition:stroke .2s}
.ring .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.phase{font-family:var(--display);font-size:30px;font-weight:700;color:var(--c,#2FC983);letter-spacing:.02em}
.secs{font-family:var(--display);font-weight:700;font-size:clamp(96px,30vw,168px);line-height:.9;font-variant-numeric:tabular-nums}
.setlbl{font-size:17px;opacity:.8;margin-top:6px}
.cue{font-size:19px;font-weight:600;margin-top:8px;min-height:1.4em;padding:0 16px}
.t-ctrl{display:flex;gap:12px;width:100%;max-width:420px}
.t-ctrl button{flex:1;padding:16px 0;border-radius:14px;border:0;font-weight:700;font-size:17px}
.t-main{background:var(--timer-ink);color:var(--timer-bg)}
.t-sec{background:rgba(255,255,255,.12);color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"><div class="banner warn" style="margin-top:24px"><b>The app hasn't started.</b> This page needs JavaScript, and file previews don't run it. Open this file in a web browser like Chrome, Safari or Firefox, or use the GitHub Pages link.</div></main>
<nav class="tabs" aria-label="Sections">
  <button data-tab="today" aria-current="page">Today</button>
  <button data-tab="crew">Ranking</button>
  <button data-tab="history">History</button>
  <button data-tab="guide">Guide</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<div id="timer" role="dialog" aria-modal="true" aria-label="Hang timer">
  <div class="t-top"><div><h3 id="tName"></h3><p id="tRx"></p></div><button class="t-close" id="tEnd">End</button></div>
  <div class="ring">
    <svg viewBox="0 0 200 200"><circle class="trackc" cx="100" cy="100" r="90"/><circle class="prog" id="tProg" cx="100" cy="100" r="90" stroke-dasharray="565.5" stroke-dashoffset="0"/></svg>
    <div class="inner"><div class="phase" id="tPhase">Ready</div><div class="secs" id="tSecs">5</div><div class="setlbl" id="tSet"></div><div class="cue" id="tCue"></div></div>
  </div>
  <div class="t-ctrl"><button class="t-sec" id="tSkip">Skip</button><button class="t-main" id="tMain">Start</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   SETUP: paste your two Supabase values between the quotes.
   Find them in Supabase > Project Settings > API
   (Project URL, and the publishable key, or the anon key under Legacy API keys).
   ========================================================= */
const SUPABASE_URL = 'https://mjogiumhumnmgkyblqgc.supabase.co/rest/v1/';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qb2dpdW1odW1ubWdreWJscWdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MjAzNTEsImV4cCI6MjEwNjE5NjM1MX0.vaBL3SqEK7kcqUcymNHex2DCsp-QFA0yaqdULvHp3m4';
// The crew. Edit names here; each person picks theirs when they open the app.
const CREW = ['Reuben', 'Jared', 'Roan', 'Noah'];

/* ---------- plan ---------- */
const WARM={id:'warm',name:'Warm-up',type:'check',
  rx:'20–30 minutes, starting with 3 minutes of joint circles, then easy climbing building up to moves close to your hardest.',
  why:'Cold fingers and shoulders are how pulleys and tendons get hurt. Never skip this.',
  how:['3 minutes of joint circles: with one arm straight, slowly draw the biggest circle you can with your hand without twisting your body, 3 each way per arm. Then do the same with each leg: lift the knee, open it out to the side and back, 3 each way. Slow and controlled.',
   '5 minutes of easy movement to raise your heart rate: jog, bike, or climb big jugs.',
   '10 minutes of easy problems, 3–4 grades below your hardest (around V5–V7 for you).',
   '10 minutes of harder problems, working up to 3–4 moves or problems close to your max, with 2–3 minutes rest between.',
   'On hangboard days, finish with 2–3 hangs of 10 seconds on the edge you are about to use, at about half effort, 1 minute rest between.']};
const MAXHANG={id:'maxhang',unit:'hang',name:'Max hangs, half-crimp on a 20mm edge',type:'timer',load:true,
  rx:c=>c?'Heavy hangs. Each one should be RPE 9: you finish feeling like you could have held about 1 more second.'
         :'Pick an added weight you could just barely hold for 13 seconds, so each 10-second hang leaves about 3 seconds in the tank. Until an X-ray clears you, stay well short of the most you could possibly hang.',
  cfg:c=>({sets:5,on:c?7:10,rest:180}),
  why:'This is the single best-studied way to build maximum finger strength.',
  how:c=>['Use the 20mm edge on your hangboard. 20mm is about ¾ of an inch deep; most boards label their edges.',
   'Grip in half-crimp: your fingers bend at the middle knuckle to about a right angle (90°), and your thumb stays off the edge. Do not full crimp, which is when the middle knuckles tent up high and the thumb wraps over the index finger.',
   'Hang with straight arms and active shoulders: pull your shoulders slightly down away from your ears, but do not bend your elbows. Feet off the ground, body still, no swinging.',
   'Add weight with a weight belt or vest. Type the extra weight (on top of your bodyweight) in the Added box so it gets logged.',
   c?'Finding your weight: after warming up, do 7-second hangs, adding 5 lb each time with 3 minutes rest, until one feels like you had only 1 second left. That is your working weight.'
    :'Finding your weight: in your first session, after warming up, do 10-second hangs, adding 5 lb each time with 3 minutes rest, until one feels like you had only 3 seconds left. That is your working weight.',
   'The timer counts down 5 seconds to get on the board, then the hang, then 3 minutes of rest before the next one.',
   'If your grip opens up, your fingers slide, or you drop early, that hang is over. Take 5 lb off for the rest of the session.',
   'Progressing: when all 5 hangs feel solid with time to spare, add 2–5 lb next session. Never add weight mid-session.']};
const OPENHANG={id:'openhang',unit:'hang',name:'3-finger drag hangs',type:'timer',load:true,
  rx:'Heavy hangs at RPE 9: you finish feeling like you could have held about 1 more second.',
  cfg:()=>({sets:3,on:7,rest:180}),
  why:'Builds finger strength in a grip that puts much less stress on the middle knuckle, where growth plate injuries happen. It also carries straight over to slopers and pockets.',
  how:['Use the same 20mm edge, or a slightly deeper one if this is too hard.',
   'Put only your index, middle and ring fingers on the edge, pinky off. Keep the fingers mostly straight, with the middle knuckles only slightly bent, so the fingertips "drag" on the edge.',
   'Finding your weight: add 5 lb per hang, with 3 minutes rest, until a 7-second hang feels like you had only 1 second left.',
   'Same form as max hangs: straight arms, shoulders pulled slightly down, no swinging.',
   'If your fingers curl into a half-crimp as you tire, that hang is over.']};
const WPULL={id:'wpull',name:'Weighted pull-ups',type:'check',load:true,
  rx:'5 sets of 3 pull-ups (15 pull-ups total), 3 minutes rest after each set. Use a weight you could do about 4 times, so each set leaves 1 rep in the tank.',
  why:'Pulling strength and finger strength together are the strongest predictors of bouldering level.',
  how:['Use a pull-up bar or big jugs, not small edges. This is about arm and back strength, not fingers.',
   'Start each rep from a dead hang with straight arms. Pull until your chin is over the bar, then lower slowly (about 2 seconds) back to straight arms.',
   'Add weight with a belt or vest and enter the added weight in the box.',
   'Finding your weight: warm up with 1 set of 5 at bodyweight, then add 10 lb per set of 3 until a set feels like you had only 1 rep left.',
   'Rest a full 3 minutes between sets. Use a phone timer.',
   'Progressing: when all 15 reps are clean with full range, add 2.5–5 lb next session.']};
const CORE={id:'core',name:'Core',type:'check',
  rx:'Hanging leg raises: 3 sets of 8. Ab wheel: 3 sets of 8. Rest 60–90 seconds between sets.',
  why:'Keeps your feet on steep walls and lets you move between holds without cutting loose.',
  how:['Hanging leg raises: hang from a bar with straight arms. Keeping your legs as straight as you can, lift your feet until they touch the bar, or at least until your legs are level with the floor. Lower slowly. No swinging; if you swing, pause at the bottom.',
   'Ab wheel: kneel with hands on the wheel. Roll forward until your body is nearly straight, keeping your back flat (don\'t let your hips sag toward the floor), then pull back to the start.',
   'If 8 reps is easy, make it harder: straighter legs, slower lowering, or ab wheel from your feet instead of your knees.']};
const FLEVER={id:'flever',unit:'hold',name:'Front lever holds',type:'timer',
  rx:'Hold the hardest version you can keep for 8 seconds with good form. 90 seconds rest between holds.',
  cfg:()=>({sets:4,on:8,rest:90}),
  why:'Builds body tension: the ability to keep your whole body stiff and your feet on steep terrain.',
  how:['A front lever is hanging from a bar with straight arms while your body is flat and parallel to the floor, face up.',
   'Versions from easiest to hardest: tuck (knees pulled to your chest), advanced tuck (back flat, knees bent at 90°), one leg straight, straddle (both legs straight and spread wide), full (legs straight together).',
   'Pick the hardest version you can hold for 8 seconds with straight arms and your hips level with your shoulders. If your hips drop or your elbows bend, go back one version.',
   'Move up a version when you can hold all 4 sets for the full 8 seconds.']};
/* ---------- end-range mobility ---------- */
const frogSeq=r=>[...Array(r)].flatMap((_,i)=>[
  {on:60,rest:3,cue:`Round ${i+1}: sink into the stretch and breathe`},
  {on:10,rest:3,cue:'Press your knees down into the floor, hard'},
  {on:10,rest:i<r-1?60:0,cue:'Try to lift your knees off the floor'}]);
const sides=(n,on,rest,a='Right side',b='Left side')=>[...Array(n)].map((_,i)=>({on,rest,cue:i%2?b:a}));
const yeSeq=(sets,reps)=>[...Array(sets)].flatMap((_,si)=>[...Array(reps)].map((_,ri)=>({on:5,rest:ri<reps-1?3:60,cue:`Set ${si+1}, rep ${ri+1}: lift and hold`})));
const seqCfg=seq=>({sets:seq.length,on:seq[0].on,rest:seq[0].rest,seq});
const FROG=(r)=>({id:'frog',name:'Frog lift-offs',type:'timer',unit:'step',noDeload:true,
  timerText:`${r} rounds: 60-second stretch, 10-second press down, 10-second lift`,
  rx:'Builds strength at the bottom of your frog position, for turning hips into the wall and high steps.',
  cfg:()=>seqCfg(frogSeq(r)),
  why:'Stretching alone gives you range you can\'t control. The press and lift teach your hips to be strong in that position, so you can use it on the wall.',
  how:['Get on hands and knees on a mat. Spread your knees wide, keep your ankles in line with your knees, and turn your feet out.',
   'Rock your hips back and down until you feel a strong but tolerable stretch in your inner thighs. Rest on your forearms if that\'s more comfortable.',
   '60-second stretch: stay still, breathe slowly, and let your hips sink a little further.',
   '10-second press: without moving, push your knees down into the floor as hard as you can. You are trying to squeeze the floor together.',
   '10-second lift: now try to lift your knees off the floor without shifting your hips. They may barely move, or not at all. That\'s normal; the effort is what counts.',
   'The timer tells you which part you\'re on. Rest a minute between rounds.']});
const NINETY=n=>({id:'ninety',name:'90/90 lift-offs',type:'timer',unit:'hold',noDeload:true,
  timerText:`${n} holds of 5 seconds, alternating sides`,
  rx:'Builds hip rotation strength for heel hooks, drop knees and staying close to the wall.',

const GLOSS=[
 ['RPE (rate of perceived exertion)','A 1–10 scale for how hard something felt. 10 means you could not have done any more. RPE 9 means about 1 more second of hanging (or 1 more rep) left. RPE 8 means about 2 left. It lets you train hard without going to total failure every time.'],
 ['Added weight','Extra weight on top of your bodyweight, worn on a weight belt or vest. The app always logs added weight only, so "+30 lb" means bodyweight plus 30 lb.'],
 ['Set and rep','A rep is one movement, like one pull-up. A set is a group of reps done back to back, then you rest. "5 sets of 3" means do 3 pull-ups, rest, and repeat until you have done 5 groups (15 pull-ups). For hangs, lifts and holds, each one is its own set: "5 hangs of 10 seconds" means hang 10 seconds, rest, and repeat until you have done 5 hangs total.'],
 ['20mm edge','A hangboard edge about ¾ of an inch deep. Most boards print the depth on each edge. It\'s the standard edge for testing so everyone\'s numbers compare fairly.'],
 ['Half-crimp','Fingers bent at the middle knuckle to about a right angle (90°), thumb not touching. The main grip for training small holds.'],
 ['Full crimp','Middle knuckles tented up high with the thumb wrapped over the index finger. The strongest grip on tiny holds, but it puts the most stress on the middle knuckle. Keep it out of hangboard training.'],
 ['Open hand','Fingers draped over the hold with the knuckles only slightly bent, like hanging off a rounded ledge. Used on slopers and for low-stress finger training.'],
 ['3-finger drag','Index, middle and ring fingers on the hold, fingers mostly straight, pinky off.'],
 ['Active shoulders','Shoulders pulled slightly down and back, away from your ears, while your arms stay straight. Hanging "loose" with shrugged shoulders strains the shoulder joint.'],
 ['Limit bouldering','Climbing problems at or near your hardest level: ones you might send in 3–10 tries. Full rests between attempts keep the quality high.'],
 ['Board angle','How steep a training board is set, in degrees past vertical. Steeper (40° or more) is harder and more powerful.'],
 ['Pinch block','A small handheld block you squeeze between thumb and fingers with weight hanging below it. Trains pinch strength.'],
 ['Max hold','A timed hold where you go as long as you can instead of a set time. The timer counts up and you tap Stop when your form breaks. Your best time is logged, and beating it is the goal.'],
 ['L-sit','Holding your body up on straight arms with your legs lifted straight out in front, making an L shape. Easier versions tuck the knees.'],
 ['Front lever','Hanging from a bar with straight arms and your body flat and parallel to the floor, face up. Easier versions tuck the knees in.'],
 ['Lock-off','Holding yourself still with one arm bent at a fixed angle, so the other hand can reach.'],
 ['Antagonists','Muscles that push rather than pull (chest, triceps, back of the shoulder, wrist extensors). Training them keeps your shoulders and elbows balanced.'],

 ['Deload','A lighter week (week 4 of each block) where you do about half the sets at the same intensity. Your body finishes adapting, and strength usually shows up after it.'],
 ['Block','An 8-week training cycle: build for 3 weeks, deload in week 4, build for weeks 5–7, test in week 8.'],
 ['Pulley','Bands of tissue that hold your finger tendons against the bone. The A2 pulley at the base of the finger is the one climbers most often injure. A pop or sharp pain at the base of a finger usually means a pulley.'],

function chart(series,opt={}){

    if(sp.length>1)g+=`<polyline fill="none" stroke="${se.color}" stroke-width="2.5" stroke-linejoin="round" points="${sp.map(p=>`${x(pd(p.d).getTime())},${y(p.v)}`).join(' ')}"/>`;
    g+=sp.map(p=>`<circle cx="${x(pd(p.d).getTime())}" cy="${y(p.v)}" r="${p.flag?6:4}" fill="${p.flag?'var(--orange)':se.color}"><title>${esc(se.label)}: ${p.v}${esc(opt.unit||'')}, ${esc(fmtDate(p.d))}</title></circle>`).join('')}
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||'Chart')}">${g}</svg></div><div class="legend">${series.filter(z=>z.points.length).map(z=>`<span><i style="background:${z.color}"></i>${esc(z.label)}</span>`).join('')}${opt.legendExtra||''}</div>`;
}
function renderHistory(){
  const who=S.histWho||S.uid;const mine=who===S.uid;
  const ser=(id,label,color)=>({label,color,points:S.logs.filter(l=>l.uid===who&&l.loads&&Number(l.loads[id])).map(l=>({d:l.date,v:Number(l.loads[id])}))});
  const hangs=[ser('maxhang','Max hang (half-crimp)','var(--green)'),ser('openhang','3-finger drag','var(--blue)'),ser('sloper','Sloper hang','var(--pink)'),ser('pinch','Pinch block','var(--orange)')];
  const best=se=>se.points.length?Math.max(...se.points.map(p=>p.v)):null;
  const last=se=>se.points.length?[...se.points].sort((a,b)=>a.d<b.d?1:-1)[0].v:null;
  let h=header()+`<section class="hero"><div class="day">History</div><p class="focus">Added weight over time. Pain history is private to each phone.</p></section>`;
  h+=`<div class="card" style="margin-bottom:6px"><label class="load" style="justify-content:space-between">Showing <select id="histWho">${CREW.map(n=>`<option ${n===who?'selected':''}>${esc(n)}</option>`).join('')}</select></label></div>`;
  h+=`<h2>Hang weights</h2><div class="card">${chart(hangs,{unit:' lb',label:'Hang weights over time',empty:`No hang weights logged${mine?'':' by '+who} yet.`})}
   <table style="margin-top:12px"><thead><tr><th>Exercise</th><th class="num">Latest</th><th class="num">Best</th></tr></thead><tbody>${hangs.map(se=>`<tr><td>${esc(se.label)}</td><td class="num">${last(se)==null?'–':'+'+last(se)+' lb'}</td><td class="num">${best(se)==null?'–':'+'+best(se)+' lb'}</td></tr>`).join('')}</tbody></table></div>`;
  const pull=[ser('wpull','Weighted pull-up','var(--ink)'),ser('pulltest','Pull-up test (1 rep)','var(--pink)')];
  hangs.push(ser('hangtest','Max hang test (7s)','var(--ink)'));
  h+=`<h2>Pull-up weight</h2><div class="card">${chart(pull,{unit:' lb',label:'Pull-up weight over time'})}</div>`;
  if(mine){
    const pts=Object.entries(S.pain).filter(([d,v])=>v&&(v.level>0||v.knuckle)).map(([d,v])=>({d,v:v.level||0,flag:!!v.knuckle}));
    const flags=pts.filter(p=>p.flag).sort((a,b)=>a.d<b.d?1:-1);
    const recent=pts.filter(p=>daysBetween(p.d,today())<=14);const avg=recent.length?(recent.reduce((a,p)=>a+p.v,0)/recent.length).toFixed(1):null;
    h+=`<h2>Finger pain</h2><div class="card">${chart([{label:'Pain (0–10)',color:'var(--muted)',points:pts}],{min:0,max:10,label:'Finger pain over time',empty:'No pain logged. Days you leave at 0 aren\'t shown.',legendExtra:'<span><i style="background:var(--orange)"></i>Middle-knuckle pain or swelling</span>'})}
     <p class="muted" style="margin:12px 0 0">${avg!=null?`Average over the last 2 weeks, on days with pain: ${avg} / 10. `:''}${flags.length?`Knuckle flags: ${flags.slice(0,6).map(p=>esc(fmtDate(p.d))).join(', ')}${flags.length>6?'…':''}.`:'No knuckle flags.'}</p>
     ${recent.filter(p=>p.v>=4||p.flag).length>=3?'<div class="banner warn" style="margin-bottom:0">Pain has come up 3 or more times in the last 2 weeks. Take weight off your hangs, stop crimping, and see a doctor if it keeps up.</div>':''}</div>`;
  }else h+=`<p class="muted" style="margin-top:14px">Finger pain history only shows for your own name, on your own phone.</p>`;
  return h;
}
function render(){
  const app=$('#app');
  app.innerHTML=S.tab==='today'?renderToday():S.tab==='crew'?renderCrew():S.tab==='guide'?renderGuide():renderHistory();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===S.tab?'page':'false'));
}

/* ---------- events ---------- */
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;render();window.scrollTo(0,0)});
$('#app').addEventListener('click',async e=>{
  const t=e.target.closest('[data-tick]');
  if(t){const id=t.dataset.tick;S.session.done[id]=!S.session.done[id];render();queueSave();return}
  const n=e.target.closest('[data-nav]');
  if(n){if(S.dirty){clearTimeout(saveTimer);await saveLog()}S.date=addDays(S.date,+n.dataset.nav);S.session=freshSession(S.date);render();return}
  const tm=e.target.closest('[data-timer]');
  if(tm){const it=planFor(S.date).items.find(i=>i.id===tm.dataset.timer);openTimer(it);return}
  if(e.target.id==='newBlock'){const {error}=await sb.from('settings').upsert({key:'block',value:{start:weekStart(today()),by:S.uid}});if(error)return handleWriteErr(error);toast('New block started');loadAll();return}
  if(e.target.id==='switchMe'){S.histWho=null;if(S.dirty){clearTimeout(saveTimer);await saveLog()}showPicker();return}
  if(e.target.id==='saveMob'){
    const d=$('#mDate').value||today(),body={uid:S.uid,date:d,createdAt:Date.now()};let any=false;
    for(const [k,el] of [['step','#mStep'],['frog','#mFrog'],['wall','#mWall']]){const v=parseFloat($(el).value);if(!isNaN(v)){body[k]=v;any=true}}
    if(!any){toast('Enter at least one number');return}
    const {error}=await sb.from('tests').insert({user_id:S.uid,date:body.date,step:body.step??null,frog:body.frog??null,wall:body.wall??null});if(error)return handleWriteErr(error);toast('Mobility test saved');loadAll();return}
  if(e.target.id==='saveTest'){
    const h=parseFloat($('#tHang').value),p=parseFloat($('#tPull').value),d=$('#tDate').value||today();
    if(isNaN(h)&&isNaN(p)){toast('Enter at least one number');return}
    const body={uid:S.uid,date:d,createdAt:Date.now()};if(!isNaN(h))body.hang=h;if(!isNaN(p))body.pull=p;
    const {error}=await sb.from('tests').insert({user_id:S.uid,date:body.date,hang:body.hang??null,pull:body.pull??null});if(error)return handleWriteErr(error);toast('Test saved');loadAll();return}
});
$('#app').addEventListener('input',e=>{
  if(e.target.dataset.measure){const k='m:'+e.target.dataset.measure,v=parseFloat(e.target.value);if(isNaN(v))delete S.session.loads[k];else S.session.loads[k]=v;queueSave()}
  if(e.target.dataset.angle){const k='a:'+e.target.dataset.angle,v=parseFloat(e.target.value);if(isNaN(v))delete S.session.loads[k];else S.session.loads[k]=v;queueSave()}
  if(e.target.dataset.load){const v=e.target.value.trim();if(v==='')delete S.session.loads[e.target.dataset.load];else{const n=parseFloat(v);if(!isNaN(n))S.session.loads[e.target.dataset.load]=n}queueSave()}
  if(e.target.id==='painR'){const p=S.pain[S.date]={...(S.pain[S.date]||{}),level:+e.target.value};$('#painV').textContent=p.level+' / 10';queuePain()}
});
$('#app').addEventListener('change',async e=>{
  if(e.target.id==='histWho'){S.histWho=e.target.value;render();return}
  if(e.target.dataset.level||e.target.dataset.grade){const k=(e.target.dataset.level?'lvl:':'g:')+(e.target.dataset.level||e.target.dataset.grade);if(e.target.value==='')delete S.session.loads[k];else S.session.loads[k]=+e.target.value;queueSave();render();return}
  if(e.target.id==='knuckle'){S.pain[S.date]={...(S.pain[S.date]||{}),knuckle:e.target.checked};queuePain();render()}
  if(e.target.id==='xray'){const c=e.target.checked;const {error}=await sb.from('settings').upsert({key:'cleared:'+S.uid,value:{cleared:c}});if(error)return handleWriteErr(error);S.members[S.uid]={cleared:c};toast(c?'Heavier protocol on':'Pre-clearance protocol on');render()}
});

/* ---------- timer ---------- */
let T=null,raf=0,actx=null,wake=null;
const CIRC=565.5;
function beep(f=880,dur=.12){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);o.start();o.stop(actx.currentTime+dur)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
const fmtT=s=>{s=Math.max(0,Math.floor(s));return s>=60?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:String(s)};
const cap=u=>u[0].toUpperCase()+u.slice(1);
function openTimer(it){
  const load=S.session.loads[it.id];
  T={it,cfg:it.timer,steps:it.timer.steps,set:1,phase:'idle',dur:5,end:0,left:5,paused:false,lastSec:null,completed:0,results:[]};
  $('#tName').textContent=it.name;
  let rx=it.timer.text+(load?`, +${load} lb`:'');
  const sc=it.scale;if(sc&&sc.kind==='level'&&S.session.loads['lvl:'+it.id]!=null)rx+=`. ${sc.levels[S.session.loads['lvl:'+it.id]]}`;
  $('#tRx').textContent=rx;
  $('#timer').classList.add('open');$('#tMain').textContent='Start';$('#tSkip').style.visibility='';$('#tSkip').textContent='Skip';paint();
}
const step=()=>T.steps[T.set-1]||{};
function setPhase(ph){
  T.phase=ph;T.lastSec=null;const st=step();
  if(ph==='ready'){T.dur=5;T.mode='count'}
  if(ph==='work'){
    if(st.on==='max'){T.mode='max';T.start=performance.now();T.hit=false;T.dur=0;$('#tMain').textContent='Stop';$('#tSkip').style.visibility='hidden'}
    else if(st.on==null){T.mode='self';T.start=performance.now();T.dur=0;$('#tMain').textContent='Done';$('#tSkip').style.visibility='hidden'}
    else{T.mode='count';T.dur=st.on;$('#tMain').textContent='Pause';$('#tSkip').style.visibility=''}
    beep(1320,.35);buzz(200);
  }
  if(ph==='rest'){T.mode='count';T.dur=st.rest;$('#tMain').textContent='Pause';$('#tSkip').style.visibility='';if(T.dur>5){beep(660,.3);buzz([80,60,80])}}
  T.end=performance.now()+T.dur*1000;T.left=T.dur;
  if((ph==='rest'||ph==='work')&&T.mode==='count'&&T.dur<=0)advance();
}
function workDone(){
  T.completed=T.set;
  if(T.set>=T.steps.length)finish(true);else setPhase('rest');
}
function stopHold(){const secs=Math.floor((performance.now()-T.start)/1000);T.results.push(secs);const k='max:'+T.it.id;const best=Math.max(...T.results);
  if(S.session.loads[k]==null||best>S.session.loads[k])S.session.loads[k]=best;queueSave();workDone()}
function advance(){
  if(T.phase==='ready')setPhase('work');
  else if(T.phase==='work'){if(T.mode==='max')stopHold();else workDone()}
  else if(T.phase==='rest'){T.set++;setPhase('work')}
}
function finish(full){
  cancelAnimationFrame(raf);
  const n=T.steps.length,done=T.completed;
  if(done>0){S.session.sets[T.it.id]=Math.max(done,S.session.sets[T.it.id]||0);if(done>=n||T.it.openEnded)S.session.done[T.it.id]=true;queueSave()}
  if(full||(T.it.openEnded&&done>0)){T.phase='done';beep(1560,.18);setTimeout(()=>beep(1760,.3),220);buzz([150,80,150]);paint();$('#tMain').textContent='Close';$('#tSkip').style.visibility='hidden'}
  else closeTimer();
  releaseWake();
}
function closeTimer(){cancelAnimationFrame(raf);$('#timer').classList.remove('open');$('#tSkip').style.visibility='';T=null;releaseWake();render()}
async function holdWake(){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
function loop(){
  if(!T)return;
  if(T.phase==='work'&&T.mode==='max'){const el=(performance.now()-T.start)/1000;if(!T.hit&&el>=T.cfg.target){T.hit=true;beep(1560,.2);buzz(120)}if(el>=300)stopHold()}
  else if(!T.paused&&T.mode==='count'&&(T.phase==='ready'||T.phase==='work'||T.phase==='rest')){
    T.left=Math.max(0,(T.end-performance.now())/1000);
    const sec=Math.ceil(T.left);
    if(sec!==T.lastSec){if(sec<=3&&sec>0&&T.dur>3)beep(T.phase==='work'?740:990,.08);T.lastSec=sec}
    if(T.left<=0)advance();
  }
  paint();if(T&&T.phase!=='done')raf=requestAnimationFrame(loop);
}
function paint(){
  if(!T)return;
  const st=step(),n=T.steps.length,U=T.it.unit||'set',oe=T.it.openEnded;
  const c=T.phase==='work'?'var(--green)':T.phase==='rest'?'var(--blue)':T.phase==='done'?'var(--pink)':'var(--orange)';
  $('#timer').style.setProperty('--c',c);
  const up=T.phase==='work'&&(T.mode==='max'||T.mode==='self'),el=up?(performance.now()-T.start)/1000:0;
  const restLbl=st.rest<=5?(st.restLabel||'Switch'):'Rest';
  $('#tPhase').textContent=T.paused?'Paused':T.phase==='idle'?'Ready':T.phase==='ready'?'Get ready':T.phase==='work'?(st.label||'Go'):T.phase==='rest'?restLbl:'Done';
  $('#tSecs').textContent=up?fmtT(el):T.phase==='done'?(T.cfg.max?Math.max(...T.results)+'s':oe?T.completed:n):fmtT(Math.ceil(T.phase==='idle'?5:T.left));
  $('#tSet').textContent=T.phase==='done'?(T.cfg.max?`best of ${n} holds`:oe?`${U}${T.completed===1?'':'s'} logged`:`${U}s complete`)
    :T.mode==='max'&&T.phase==='work'?`Hold ${T.set} of ${n}. Target ${T.cfg.target}s`
    :oe?`${cap(U)} ${T.set}`:`${cap(U)} ${T.set} of ${n}`;
  let cue='';
  if(T.cfg.max)cue=T.results.length?'Holds so far: '+T.results.map(x=>x+'s').join(', '):'';
  else if(T.phase==='work'||T.phase==='ready'||T.phase==='idle')cue=st.cue||'';
  else if(T.phase==='rest'&&T.steps[T.set])cue='Next: '+T.steps[T.set].cue;
  $('#tCue').textContent=cue;
  const frac=T.mode==='max'&&T.phase==='work'?Math.min(1,el/T.cfg.target):T.mode==='self'&&T.phase==='work'?0:T.phase==='done'?1:T.phase==='idle'?0:(T.dur?1-(T.left/T.dur):1);
  $('#tProg').setAttribute('stroke-dashoffset',String(CIRC*(1-frac)));
}
$('#tMain').addEventListener('click',()=>{
  if(!T)return;
  if(T.phase==='done'){closeTimer();return}
  if(T.phase==='idle'){beep(440,.01);setPhase('ready');holdWake();$('#tMain').textContent='Pause';raf=requestAnimationFrame(loop);return}
  if(T.phase==='work'&&T.mode==='max'){stopHold();return}
  if(T.phase==='work'&&T.mode==='self'){workDone();return}
  if(T.paused){T.paused=false;T.end=performance.now()+T.left*1000;$('#tMain').textContent='Pause'}
  else{T.paused=true;$('#tMain').textContent='Resume'}
});
$('#tSkip').addEventListener('click',()=>{if(!T||T.phase==='idle'||T.phase==='done')return;if(T.paused){T.paused=false;$('#tMain').textContent='Pause'}advance()});
$('#tEnd').addEventListener('click',()=>{if(!T)return;if(T.phase==='done'){closeTimer();return}if(T.phase==='work'&&T.mode==='self'&&T.it.openEnded)T.completed=T.set;finish(false)});

/* ---------- pick your name and boot ---------- */
function showPicker(){
  document.querySelector('nav.tabs').style.display='none';
  $('#app').innerHTML=`<div class="brand"><span><b>RNR Sends</b> crew training</span></div><section class="hero"><div class="day">Who are you?</div><p class="focus">This phone will remember your pick. You can switch any time from the name button at the top.</p></section>
   <div class="who">${CREW.map(n=>`<button data-me="${esc(n)}">${esc(n)}</button>`).join('')}</div>`;
  document.querySelectorAll('[data-me]').forEach(b=>b.onclick=()=>{S.uid=b.dataset.me;try{localStorage.setItem('rnr-me',S.uid)}catch(e){}enter()});
}
let started=false;
async function enter(){
  document.querySelector('nav.tabs').style.display='';
  S.tab='today';S.dirty=false;loadPain();S.session=freshSession(S.date);render();
  await loadAll();
  if(!started){started=true;
    sb.channel('crew').on('postgres_changes',{event:'*',schema:'public',table:'logs'},scheduleReload)
      .on('postgres_changes',{event:'*',schema:'public',table:'settings'},scheduleReload).subscribe();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)scheduleReload()});
    setInterval(()=>{if(!document.hidden)scheduleReload()},60000);
  }
}
function boot(){
  if(!window.supabase||SUPABASE_URL.startsWith('PASTE')||SUPABASE_ANON_KEY.startsWith('PASTE')){
    $('#app').innerHTML=`<div class="banner warn" style="margin-top:24px">${window.supabase?'The site isn\'t connected to a database yet. Open index.html and paste your Supabase Project URL and key into the two lines marked SETUP near the top of the script.':'Couldn\'t load the Supabase library. Check your internet connection and refresh.'}</div>`;document.querySelector('nav.tabs').style.display='none';return}
  sb=window.supabase.createClient(SUPABASE_URL.trim().replace(/\/+$/,''),SUPABASE_ANON_KEY.trim(),{auth:{persistSession:false,autoRefreshToken:false}});
  let me=null;try{me=localStorage.getItem('rnr-me')}catch(e){}
  if(me&&CREW.includes(me)){S.uid=me;enter()}else showPicker();
}
boot();
</script>
